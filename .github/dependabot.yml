version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directories:
      - "/dev"
      - "/tests"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # The mock Python image digest is pinned in scripts/ci_docker_helpers.py
      # and the ensure-mock-python-image cache key; bump them together by hand.
      - dependency-name: "library/python"
    groups:
      docker-compose:
        patterns:
          - "*"
