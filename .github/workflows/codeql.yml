name: CodeQL

on:
  push:
    branches:
      - main
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ vars.TRUSTED_RUNNER_LABEL || (github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'uecb-shared') }}
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        language: [go, actions]
    # uecb-shared can place this job on a 1 GiB GCE runner (MemTotal ~958 MiB
    # on run 42657876846). CodeQL reserves 1024 MiB and exports the remainder,
    # which was CODEQL_RAM=-66. Analyze treats that export as an explicit
    # setting and fails with Invalid RAM setting. Pin the CLI minimum for the
    # actions leg so autodetection is skipped. Smaller values are rounded up
    # to 2048 by the CLI. One thread limits parallel query evaluation on that
    # 2-vCPU VM. The go leg is left unset (#388).
    env:
      CODEQL_RAM: ${{ matrix.language == 'actions' && '2048' || '' }}
      CODEQL_THREADS: ${{ matrix.language == 'actions' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: matrix.language == 'go'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

      - name: Analyze
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{ matrix.language }}"
