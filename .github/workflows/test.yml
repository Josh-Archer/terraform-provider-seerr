name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      integration_mode:
        description: Which integration coverage to run
        required: true
        default: stable
        type: choice
        options:
          - stable
          - full
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    # Fork and same-repository PRs always use an isolated GitHub-hosted runner.
    # Trusted runs can use UECB or an isolated self-hosted runner via this label.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || vars.TRUSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.0
      - run: go mod download
      - name: Run fast merge gate
        run: bash ./scripts/test-all-locally.sh
        env:
          SEERR_RUN_LINT: "false"
          SEERR_RUN_INTEGRATION: "false"
      - name: Run OpenAPI coverage check
        run: go run ./tools/openapi
      - name: Check tested Seerr versions match upstream-compatibility.json
        run: python3 -m unittest discover -s tests -p test_compat_matrix.py
      - name: Test upstream watch reconciliation
        run: python3 -m unittest discover -s tests -p test_upstream_watch.py
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.5.0
          verify: false

  tofu-test-stable:
    name: OpenTofu Compatibility (${{ matrix.target }}, ${{ matrix.tofu_version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: tofu
            target: seerr-v3.5.0
            tofu_version: 1.8.0
            image: seerr/seerr:v3.5.0
            filters: ""
          - engine: tofu
            target: seerr-v3.4.1
            tofu_version: 1.8.0
            image: seerr/seerr:v3.4.1
            filters: ""
          - engine: tofu
            target: jellyseerr-v2.7.3
            tofu_version: 1.8.0
            image: fallenbagel/jellyseerr:2.7.3
            filters: >-
              api_objects.tftest.hcl
              backup_settings.tftest.hcl
              current_user.tftest.hcl
              data_sources.tftest.hcl
              discover.tftest.hcl
              discover_slider_data_source.tftest.hcl
              features.tftest.hcl
              issue.tftest.hcl
              job_schedule.tftest.hcl
              override_rule.tftest.hcl
              request.tftest.hcl
              servers.tftest.hcl
              settings.tftest.hcl
              user.tftest.hcl
              user_permissions.tftest.hcl
          - engine: tofu
            target: overseerr-v1.35.0
            tofu_version: 1.8.0
            image: sctx/overseerr:1.35.0
            filters: >-
              current_user.tftest.hcl
              data_sources.tftest.hcl
              discover_slider_data_source.tftest.hcl
              features.tftest.hcl
              issue.tftest.hcl
              job_schedule.tftest.hcl
              request.tftest.hcl
              servers.tftest.hcl
              settings.tftest.hcl
              user.tftest.hcl
              user_permissions.tftest.hcl
    env:
      USE_SELF_HOSTED: "false"
      SEERR_TEST_ENGINE: ${{ matrix.engine }}
      SEERR_TEST_IMAGE: ${{ matrix.image }}
      SEERR_TEST_FILTERS: ${{ matrix.filters }}
      SEERR_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/integration-${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu_version }}
      - name: Use legacy external Seerr target when configured
        shell: bash
        run: |
          if [[ -n "${LEGACY_SEERR_URL:-}" ]] && [[ "${USE_SELF_HOSTED:-false}" == "false" ]]; then
            echo "Using Legacy External Seerr Instance"
            echo "SEERR_URL=${LEGACY_SEERR_URL}" >> "$GITHUB_ENV"
            echo "SEERR_API_KEY=${LEGACY_SEERR_API_KEY}" >> "$GITHUB_ENV"
          fi
      - name: Run stable lifecycle suite
        shell: bash
        run: bash ./scripts/test-integration.sh
        env:
          SEERR_TEST_SUITE: stable
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-artifacts-${{ matrix.engine }}-${{ matrix.target }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  terraform-test-stable:
    name: Terraform Compatibility (${{ matrix.target }}, ${{ matrix.terraform_version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: seerr-v3.5.0
            engine: terraform
            terraform_version: 1.8.5
            image: seerr/seerr:v3.5.0
            filters: ""
          - target: seerr-v3.4.1
            engine: terraform
            terraform_version: 1.8.5
            image: seerr/seerr:v3.4.1
            filters: ""
          - target: jellyseerr-v2.7.3
            engine: terraform
            terraform_version: 1.8.5
            image: fallenbagel/jellyseerr:2.7.3
            filters: >-
              api_objects.tftest.hcl
              backup_settings.tftest.hcl
              current_user.tftest.hcl
              data_sources.tftest.hcl
              discover.tftest.hcl
              discover_slider_data_source.tftest.hcl
              features.tftest.hcl
              issue.tftest.hcl
              job_schedule.tftest.hcl
              override_rule.tftest.hcl
              request.tftest.hcl
              servers.tftest.hcl
              settings.tftest.hcl
              user.tftest.hcl
              user_permissions.tftest.hcl
          - target: overseerr-v1.35.0
            engine: terraform
            terraform_version: 1.8.5
            image: sctx/overseerr:1.35.0
            filters: >-
              current_user.tftest.hcl
              data_sources.tftest.hcl
              discover_slider_data_source.tftest.hcl
              features.tftest.hcl
              issue.tftest.hcl
              job_schedule.tftest.hcl
              request.tftest.hcl
              servers.tftest.hcl
              settings.tftest.hcl
              user.tftest.hcl
              user_permissions.tftest.hcl
    env:
      USE_SELF_HOSTED: "false"
      SEERR_TEST_ENGINE: ${{ matrix.engine }}
      SEERR_TEST_IMAGE: ${{ matrix.image }}
      SEERR_TEST_FILTERS: ${{ matrix.filters }}
      SEERR_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/integration-${{ matrix.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ matrix.terraform_version }}
          terraform_wrapper: false
      - name: Use legacy external Seerr target when configured
        shell: bash
        run: |
          if [[ -n "${LEGACY_SEERR_URL:-}" ]] && [[ "${USE_SELF_HOSTED:-false}" == "false" ]]; then
            echo "Using Legacy External Seerr Instance"
            echo "SEERR_URL=${LEGACY_SEERR_URL}" >> "$GITHUB_ENV"
            echo "SEERR_API_KEY=${LEGACY_SEERR_API_KEY}" >> "$GITHUB_ENV"
          fi
      - name: Run stable lifecycle suite
        shell: bash
        run: bash ./scripts/test-integration.sh
        env:
          SEERR_TEST_SUITE: stable
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: compatibility-artifacts-${{ matrix.engine }}-${{ matrix.target }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  consumer-replay:
    name: Consumer Replay (arr-config)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 25
    # Required by release gating: rc -> final promotion needs this job green on the tagged commit.
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      SEERR_TEST_IMAGE: seerr/seerr:v3.5.0
      SEERR_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/consumer-replay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.0
          tofu_wrapper: false
      - name: Replay consumer config (apply, clean re-plan, upgrade from previous release)
        run: bash ./scripts/test-consumer-replay.sh
      - name: Upload consumer replay diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: consumer-replay-artifacts
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  watchlist-live:
    name: Watchlist Live Integration (Seerr 3.5.0)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Validate integration path filter
        run: python3 -m unittest discover -s tests -p test_watchlist_ci_filter.py
      - name: Select watchlist integration
        id: watchlist_filter
        env:
          WATCHLIST_EVENT: ${{ github.event_name }}
        run: |
          run_integration="$(python3 ./scripts/watchlist_ci_filter.py "${WATCHLIST_EVENT}")"
          echo "run=${run_integration}" >> "$GITHUB_OUTPUT"
          echo "Watchlist live integration selected: ${run_integration}"
      - if: steps.watchlist_filter.outputs.run == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenTofu
        if: steps.watchlist_filter.outputs.run == 'true'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.8.0
          tofu_wrapper: false
      - name: Run isolated Seerr 3.5.0 watchlist integration
        if: steps.watchlist_filter.outputs.run == 'true'
        run: python3 ./scripts/test_watchlist_live.py
        env:
          SEERR_WATCHLIST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/watchlist-live
      - name: Upload watchlist integration diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: watchlist-live-seerr-3.5.0
          path: test-artifacts/watchlist-live/
          if-no-files-found: ignore
          retention-days: 7

  tofu-test-stable-trusted:
    name: OpenTofu Stable Integration Trusted (${{ matrix.tofu_version }})
    runs-on: ${{ vars.TRUSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: integration
    permissions:
      contents: read
    timeout-minutes: 15
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.integration_mode != 'full')
    strategy:
      fail-fast: false
      matrix:
        tofu_version:
          - 1.8.0
    env:
      USE_SELF_HOSTED: ${{ vars.USE_SELF_HOSTED || 'false' }}
      LEGACY_SEERR_URL: ${{ secrets.SEERR_URL }}
      LEGACY_SEERR_API_KEY: ${{ secrets.SEERR_API_KEY }}
      SEERR_TEST_IMAGE: ${{ vars.SEERR_TEST_IMAGE || 'seerr/seerr:v3.5.0' }}
      SEERR_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/integration-trusted
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu_version }}
      - name: Use legacy external Seerr target when configured
        shell: bash
        run: |
          if [[ -n "${LEGACY_SEERR_URL:-}" ]] && [[ "${USE_SELF_HOSTED:-false}" == "false" ]]; then
            echo "Using Legacy External Seerr Instance"
            echo "SEERR_URL=${LEGACY_SEERR_URL}" >> "$GITHUB_ENV"
            echo "SEERR_API_KEY=${LEGACY_SEERR_API_KEY}" >> "$GITHUB_ENV"
          fi
      - name: OpenTofu stable suite
        shell: bash
        run: bash ./scripts/test-integration.sh
        env:
          SEERR_TEST_SUITE: stable
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trusted-stable-integration-artifacts-${{ matrix.tofu_version }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  tofu-test-full:
    name: OpenTofu Full Compatibility (${{ matrix.tofu_version }})
    runs-on: ${{ vars.TRUSTED_RUNNER_LABEL || 'ubuntu-latest' }}
    environment: integration
    permissions:
      contents: read
    timeout-minutes: 20
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.integration_mode != 'stable')
    strategy:
      fail-fast: false
      matrix:
        tofu_version:
          - 1.8.0
    env:
      USE_SELF_HOSTED: ${{ vars.USE_SELF_HOSTED || 'false' }}
      LEGACY_SEERR_URL: ${{ secrets.SEERR_URL }}
      LEGACY_SEERR_API_KEY: ${{ secrets.SEERR_API_KEY }}
      SEERR_TEST_IMAGE: ${{ vars.SEERR_TEST_IMAGE || 'seerr/seerr:v3.5.0' }}
      SEERR_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/integration-full
      SEERR_TEST_SUITE: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ matrix.tofu_version }}
      - name: Use legacy external Seerr target when configured
        shell: bash
        run: |
          if [[ -n "${LEGACY_SEERR_URL:-}" ]] && [[ "${USE_SELF_HOSTED:-false}" == "false" ]]; then
            echo "Using Legacy External Seerr Instance"
            echo "SEERR_URL=${LEGACY_SEERR_URL}" >> "$GITHUB_ENV"
            echo "SEERR_API_KEY=${LEGACY_SEERR_API_KEY}" >> "$GITHUB_ENV"
          fi
      - name: OpenTofu full suite
        shell: bash
        run: bash ./scripts/test-integration.sh
      - name: Upload full-suite diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: full-integration-artifacts-${{ matrix.tofu_version }}
          path: test-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  release-snapshot:
    name: Release Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build provider release snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --snapshot --clean --skip=sign --parallelism=2

      - name: Verify registry artifacts exist
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/terraform-provider-seerr_linux_amd64_v1/terraform-provider-seerr_v0.0.0-SNAPSHOT-* || \
            find dist -type f -name 'terraform-provider-seerr_v*' -print -quit | grep -q .
          checksum_file="$(find dist -maxdepth 1 -type f -name 'terraform-provider-seerr_*_SHA256SUMS' -print -quit)"
          test -n "${checksum_file}"
          manifest_line="$(grep -E ' terraform-provider-seerr_.+_manifest\.json$' "${checksum_file}")"
          test "$(printf '%s\n' "${manifest_line}" | grep -c .)" -eq 1
          read -r manifest_digest _ <<< "${manifest_line}"
          expected_manifest_digest="$(sha256sum terraform-registry-manifest.json | awk '{print $1}')"
          test "${manifest_digest}" = "${expected_manifest_digest}"
          python3 - <<'PY'
          import json
          with open("terraform-registry-manifest.json", encoding="utf-8") as stream:
              manifest = json.load(stream)
          assert manifest == {"version": 1, "metadata": {"protocol_versions": ["6.0"]}}
          PY

  auto-merge:
    name: Auto Merge
    needs: [build-test, tofu-test-stable, watchlist-live, consumer-replay]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    if: |
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      (github.actor == 'Josh-Archer' || github.actor == 'app/github-actions' || github.actor == 'github-actions[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Enable auto-merge for pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "Enabling auto-merge for ${PR_URL} authored by ${GITHUB_ACTOR}..."
          gh pr merge "${PR_URL}" --auto --squash
