name: Prerelease

on:
  push:
    branches:
      - main

concurrency:
  group: prerelease
  cancel-in-progress: true

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  prerelease:
    name: Prerelease RC
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Skip RC on already-tagged or release-please commits
        id: skip
        shell: bash
        run: |
          set -euo pipefail
          skip=false
          if git describe --exact-match --tags HEAD 2>/dev/null | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "HEAD is already a stable release tag; skipping RC."
            skip=true
          fi
          subject="$(git log -1 --format=%s)"
          if [[ "${subject}" =~ ^chore(\(main\))?:\ release[[:space:]] ]] || [[ "${subject}" == Merge\ pull\ request*release* ]]; then
            echo "HEAD is a release-please commit; skipping RC."
            skip=true
          fi
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"

      - name: Compute next stable version
        id: version
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          # Find the latest stable semver tag (vX.Y.Z with no prerelease suffix).
          stable_pattern='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          latest_stable="$(git tag --list 'v*' --sort=-v:refname \
            | grep -E "${stable_pattern}" \
            | head -n 1 || true)"

          if [[ -z "${latest_stable}" ]]; then
            latest_stable="v0.0.0"
          fi

          echo "Latest stable tag: ${latest_stable}"

          # Parse components.
          IFS='.' read -r major_dot minor patch_raw <<< "${latest_stable#v}"
          major="${major_dot}"
          minor="${minor}"
          patch="${patch_raw%%[^0-9]*}"

          # Determine bump type based on conventional commits since latest stable tag.
          commit_messages="$(git log "${latest_stable}..HEAD" --format="%B" 2>/dev/null || true)"

          bump="patch"
          if echo "${commit_messages}" | grep -qE "(BREAKING CHANGE:|^[a-zA-Z]+(\([^)]+\))?!:)"; then
            if [[ "${major}" -eq 0 ]]; then
              bump="minor"
            else
              bump="major"
            fi
          elif echo "${commit_messages}" | grep -qE "^feat(\([^)]+\))?:"; then
            bump="minor"
          fi

          if [[ "${bump}" == "major" ]]; then
            next_major=$(( major + 1 ))
            next_stable="v${next_major}.0.0"
          elif [[ "${bump}" == "minor" ]]; then
            next_minor=$(( minor + 1 ))
            next_stable="v${major}.${next_minor}.0"
          else
            next_patch=$(( patch + 1 ))
            next_stable="v${major}.${minor}.${next_patch}"
          fi

          echo "Next stable version will be: ${next_stable} (bump=${bump})"
          # Count how many RC tags already exist for this next stable.
          rc_pattern="^${next_stable}-rc\.[0-9]+$"
          rc_count="$(git tag --list "${next_stable}-rc.*" \
            | grep -cE "${rc_pattern}" || true)"
          next_rc=$(( rc_count + 1 ))

          rc_tag="${next_stable}-rc.${next_rc}"
          echo "rc_tag=${rc_tag}" >> "${GITHUB_OUTPUT}"
          echo "next_stable=${next_stable}" >> "${GITHUB_OUTPUT}"
          echo "Prerelease tag: ${rc_tag}"

      - name: Create and push prerelease tag
        if: steps.skip.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RC_TAG: ${{ steps.version.outputs.rc_tag }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${RC_TAG}" -m "Prerelease candidate ${RC_TAG}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${RC_TAG}"
          echo "Created and pushed tag ${RC_TAG} for commit $(git rev-parse HEAD)"

      - name: Detect signing availability
        id: signing
        if: steps.skip.outputs.skip != 'true'
        run: |
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ] && [ -n "${{ secrets.PASSPHRASE }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Import GPG key
        if: steps.skip.outputs.skip != 'true' && steps.signing.outputs.enabled == 'true'
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7.0.0
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.PASSPHRASE }}
      - name: Run GoReleaser prerelease (signed)
        if: steps.skip.outputs.skip != 'true' && steps.import_gpg.outputs.fingerprint != ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.rc_tag }}

      - name: Run GoReleaser prerelease (unsigned fallback)
        if: steps.skip.outputs.skip != 'true' && steps.import_gpg.outputs.fingerprint == ''
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          args: release --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.version.outputs.rc_tag }}
