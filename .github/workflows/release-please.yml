name: Release Please

on:
  workflow_dispatch:
  # Bot merges use GITHUB_TOKEN, so their push event cannot start this workflow.
  workflow_run:
    workflows: [CI]
    types: [completed]
  # Recover delayed auto-merges or missed completion events.
  schedule:
    - cron: '17 * * * *'
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # Never execute PR code here; release-please reads the default branch via API.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: .github/release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Trigger Release workflow on release creation
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          echo "Release-please created release tag ${RELEASE_TAG}. Dispatching Release workflow..."
          gh workflow run release.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref "${DEFAULT_BRANCH}" \
            -f "release_tag=${RELEASE_TAG}"
