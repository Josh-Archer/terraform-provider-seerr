services:
  seerr:
    image: ${SEERR_TEST_IMAGE:-seerr/seerr:v3.5.2}
    container_name: seerr-test
    environment:
      - LOG_LEVEL=debug
      - PORT=5055
    ports:
      - "15055:5055"
    volumes:
      - seerr_config:/app/config
    restart: always
  plex-mock:
    image: ${SEERR_MOCK_PYTHON_IMAGE:-mirror.gcr.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd}
    environment:
      - SERVICE_KIND=plex
      - PORT=32400
    command: ["python", "/fixtures/mock_media_service.py"]
    volumes:
      - ./fixtures:/fixtures:ro

  jellyfin-mock:
    image: ${SEERR_MOCK_PYTHON_IMAGE:-mirror.gcr.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd}
    environment:
      - SERVICE_KIND=jellyfin
      - PORT=8096
      - EXPECTED_API_KEY=abc123mockkey
    command: ["python", "/fixtures/mock_media_service.py"]
    volumes:
      - ./fixtures:/fixtures:ro

  tautulli-mock:
    image: ${SEERR_MOCK_PYTHON_IMAGE:-mirror.gcr.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd}
    environment:
      - SERVICE_KIND=tautulli
      - PORT=8181
      - EXPECTED_API_KEY=tautulli_mock_key
    command: ["python", "/fixtures/mock_media_service.py"]
    volumes:
      - ./fixtures:/fixtures:ro

  radarr-mock:
    image: ${SEERR_MOCK_PYTHON_IMAGE:-mirror.gcr.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd}
    environment:
      - SERVICE_KIND=radarr
      - PORT=7878
      - EXPECTED_API_KEY=radarr_api_key
    command: ["python", "/fixtures/mock_media_service.py"]
    volumes:
      - ./fixtures:/fixtures:ro

  sonarr-mock:
    image: ${SEERR_MOCK_PYTHON_IMAGE:-mirror.gcr.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd}
    environment:
      - SERVICE_KIND=sonarr
      - PORT=8989
      - EXPECTED_API_KEY=sonarr_api_key
    command: ["python", "/fixtures/mock_media_service.py"]
    volumes:
      - ./fixtures:/fixtures:ro

  notify-mock:
    image: ${SEERR_MOCK_PYTHON_IMAGE:-mirror.gcr.io/library/python:3.15-alpine@sha256:0f9552bb28711333da16915ec146f5e6bb44a7fdac9ced15dc17c2e0206346dd}
    environment:
      - SERVICE_KIND=generic
      - PORT=8080
    command: ["python", "/fixtures/mock_media_service.py"]
    volumes:
      - ./fixtures:/fixtures:ro

volumes:
  seerr_config:
